name: "Stage: Deploy Python Service"

# ─────────────────────────────────────────────────────────────────────────────
# Reusable stage — called by any Python/Docker service workflow.
#
# Callers MUST set:  runner, dest_dir, environment, service_name
# Callers CAN set:   compose_file, deploy_script, verify_script
#
# Deploy flow:
#   1. git fetch + checkout the pushed tag into dest_dir (clone on first deploy)
#   2. docker compose build --no-cache
#   3. docker compose up -d --force-recreate
#   OR if deploy_script is set, run that instead of steps 2-3
#
# NOTE: .env must already exist on the VM at dest_dir/.env
#       Manage it manually or via a separate secrets pipeline.
#
# Required secret: vm_password
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_call:
    inputs:
      runner:
        description: 'Runner labels as a JSON array, e.g. ["self-hosted","azure-runner"]'
        type: string
        required: true
      dest_dir:
        description: "Absolute path on the VM where the service lives, e.g. /var/www/my-service"
        type: string
        required: true
      compose_file:
        description: "Docker Compose file passed to docker compose / deploy_script"
        type: string
        default: "docker-compose.yml"
      environment:
        description: "Deployment environment label (dev | prod)"
        type: string
        required: true
      service_name:
        description: "Human-readable service name used in log messages"
        type: string
        required: true
      deploy_script:
        description: >
          Optional custom deploy script path relative to dest_dir.
          When set, runs this instead of `docker compose build/up`.
          COMPOSE_FILE is exported for the script to consume.
          Example: "scripts/deploy_docker_stack.sh"
        type: string
        default: ""
      verify_script:
        description: >
          Optional post-deploy verify script path relative to dest_dir.
          Only used when deploy_script is also set.
          Example: "scripts/verify_celery_stack.sh"
        type: string
        default: ""

    secrets:
      vm_password:
        description: "sudo password for the self-hosted runner user"
        required: true

    outputs:
      deploy_log:
        description: "Last 3 500 characters of the deployment log"
        value: ${{ jobs.deploy.outputs.deploy_log }}

jobs:
  deploy:
    name: "Deploy (${{ inputs.environment }})"
    runs-on: ${{ fromJSON(inputs.runner) }}
    outputs:
      deploy_log: ${{ steps.deploy_step.outputs.deploy_log }}

    steps:
      - name: Deploy and validate
        id: deploy_step
        env:
          VM_PASSWORD: ${{ secrets.vm_password }}
          COMPOSE_FILE: ${{ inputs.compose_file }}
          DEST_DIR: ${{ inputs.dest_dir }}
          DEPLOY_SCRIPT: ${{ inputs.deploy_script }}
          VERIFY_SCRIPT: ${{ inputs.verify_script }}
          DEPLOY_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          set -eo pipefail
          LOG_FILE=$(mktemp)
          ENV_BACKUP="/tmp/.env_backup_$(basename $DEST_DIR)"
          save_log() {
            TRUNCATED_LOG=$(tail -c 3500 "$LOG_FILE" 2>/dev/null || true)
            printf 'deploy_log<<EOF\n%s\nEOF\n' "$TRUNCATED_LOG" >> "$GITHUB_OUTPUT"
            rm -f "$LOG_FILE"
          }
          trap save_log EXIT

          echo ">>> [${{ inputs.environment }}] Deploying ${{ inputs.service_name }} tag=$DEPLOY_TAG → $DEST_DIR" | tee -a "$LOG_FILE"

          # ── Pull code via git (clone on first deploy, fetch+checkout after) ──
          if [ ! -d "$DEST_DIR/.git" ]; then
            echo ">>> First deploy — cloning repository..." | tee -a "$LOG_FILE"
            echo "$VM_PASSWORD" | sudo -S git clone \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPO}.git" \
              "$DEST_DIR" 2>&1 | tee -a "$LOG_FILE"
          fi

          # ── Backup .env before checkout to prevent overwrite ──────────────
          if echo "$VM_PASSWORD" | sudo -S test -f "$DEST_DIR/.env"; then
            echo ">>> Backing up .env..." | tee -a "$LOG_FILE"
            echo "$VM_PASSWORD" | sudo -S cp "$DEST_DIR/.env" "$ENV_BACKUP"
          fi

          echo ">>> Fetching tags and checking out $DEPLOY_TAG..." | tee -a "$LOG_FILE"
          echo "$VM_PASSWORD" | sudo -S git -C "$DEST_DIR" fetch --tags 2>&1 | tee -a "$LOG_FILE"
          echo "$VM_PASSWORD" | sudo -S git -C "$DEST_DIR" checkout "$DEPLOY_TAG" 2>&1 | tee -a "$LOG_FILE"

          # ── Restore .env after checkout ───────────────────────────────────
          if [ -f "$ENV_BACKUP" ]; then
            echo ">>> Restoring .env..." | tee -a "$LOG_FILE"
            echo "$VM_PASSWORD" | sudo -S cp "$ENV_BACKUP" "$DEST_DIR/.env"
            rm -f "$ENV_BACKUP"
          fi

          cd "$DEST_DIR"

          # ── Mode A: custom deploy script ──────────────────────────────────
          if [ -n "$DEPLOY_SCRIPT" ]; then
            echo ">>> Running deploy script: $DEPLOY_SCRIPT" | tee -a "$LOG_FILE"
            echo "$VM_PASSWORD" | sudo -S COMPOSE_FILE="$COMPOSE_FILE" bash "./$DEPLOY_SCRIPT" 2>&1 | tee -a "$LOG_FILE"

            if [ -n "$VERIFY_SCRIPT" ]; then
              echo ">>> Running verify script: $VERIFY_SCRIPT" | tee -a "$LOG_FILE"
              echo "$VM_PASSWORD" | sudo -S COMPOSE_FILE="$COMPOSE_FILE" bash "./$VERIFY_SCRIPT" 2>&1 | tee -a "$LOG_FILE"
            fi

          # ── Mode B: standard docker compose ──────────────────────────────
          else
            echo ">>> docker compose build + up..." | tee -a "$LOG_FILE"
            echo "$VM_PASSWORD" | sudo -S docker compose -f "$COMPOSE_FILE" build --no-cache 2>&1 | tee -a "$LOG_FILE"
            echo "$VM_PASSWORD" | sudo -S docker compose -f "$COMPOSE_FILE" up -d --force-recreate 2>&1 | tee -a "$LOG_FILE"
            sleep 20
          fi

          # ── Cleanup old images ────────────────────────────────────────────
          echo "$VM_PASSWORD" | sudo -S docker image prune -af --filter "until=24h" 2>&1 | tee -a "$LOG_FILE"
          echo ">>> Deployment complete — tag: $DEPLOY_TAG" | tee -a "$LOG_FILE"
