name: "Stage: Build & Push Image (ACR)"

# ─────────────────────────────────────────────────────────────────────────────
# Reusable stage — builds a Docker image and pushes it to Azure Container
# Registry. This is the GitHub Actions / ACR equivalent of the GitLab
# stage/gitlab/docker/build.yaml and stage/gitlab/kaniko/build.yaml jobs:
# same tagging convention (branch build -> <sha> + <ref>, tag build ->
# <sha> + <ref> + latest), reimplemented with `docker build` + `az acr login`.
#
# Required secrets: acr_login_server, acr_username, acr_password
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_call:
    inputs:
      runner:
        description: >
          Runner labels as a JSON array. If the caller sets this, that value is used;
          if omitted, falls back to the in-cluster momah/ai-garden runner below.
        type: string
        default: '["self-hosted", "linux", "x64", "momah", "ai-garden"]'
      image_name:
        description: >
          Image repo path, without registry, e.g. momah-service/strategic_execution_system.
          Convention: every service's image lives under the `momah-service/` prefix in ACR
          (ministermindacr.azurecr.io/momah-service/<service>), keeping images distinct
          from the `helm/momah-service` chart repo path.
        type: string
        required: true
      context:
        description: "Docker build context, relative to repo root"
        type: string
        default: "."
      dockerfile:
        description: "Path to the Dockerfile, relative to repo root"
        type: string
        default: "Dockerfile"
      build_args:
        description: "Extra --build-arg entries, one per line (KEY=VALUE)"
        type: string
        default: ""

    secrets:
      # All three are optional now. The runner mounts an ACR push credential at
      # /etc/acr/config.json (action-runner/runner-minister.yaml) and that is
      # the preferred source; these remain as a fallback for runners without
      # the mount. Passing an empty secret used to produce
      # `docker login --username ""` -> "Must provide --username with
      # --password-stdin", which is why the build now checks before logging in.
      acr_login_server:
        description: >
          e.g. youracr.azurecr.io. Optional — when omitted it is read from the
          registry host in the mounted credential.
        required: false
      acr_username:
        required: false
      acr_password:
        required: false
      extra_build_arg_secrets:
        description: >
          Extra --build-arg entries sourced from secrets, one per line (KEY=VALUE).
          Use this instead of `build_args` whenever a value comes from `secrets.*` —
          the `secrets` context is not available inside a caller's `with:` block, only
          inside `secrets:`, so values that must be interpolated from a GitHub secret
          have to be passed here. Note these are NOT masked in the image layers
          (`docker history` reveals them) — only pass values that are already safe to
          embed client-side, e.g. a Vite/public key, never a real backend credential.
        required: false

    outputs:
      image_ref:
        description: "Full image ref pushed for this build (registry/name:sha)"
        value: ${{ jobs.build.outputs.image_ref }}
      image_digest:
        description: >
          Manifest digest of the image just pushed, as `sha256:…`. Needed by
          callers whose ArgoCD app uses Image Updater's `digest` strategy: the
          tag they push is mutable (a branch name), so the only way to tell the
          new deploy from the old one is the digest. Pass it to
          verify-deploy.yml's `image_digest` input.
        value: ${{ jobs.build.outputs.image_digest }}

jobs:
  build:
    name: Build & Push
    runs-on: ${{ fromJSON(inputs.runner) }}
    # No job container. This used to run in docker:24-dind on the assumption
    # that the in-cluster runner had no docker, but it does — the runner drives
    # /usr/local/bin/docker against its dind sidecar, which is how it built the
    # job container in the first place. Running directly on the runner is also
    # what makes the mounted ACR credential reachable: a secret mounted into the
    # runner pod is not visible inside a job container.
    outputs:
      image_ref: ${{ steps.build_step.outputs.image_ref }}
      image_digest: ${{ steps.build_step.outputs.image_digest }}

    steps:
      # The runner's docker CLI has no buildx plugin, so `docker build` quietly
      # falls back to the legacy builder ("DEPRECATED: The legacy builder is
      # deprecated"). That builder spawns a container per Dockerfile instruction
      # — 27 of them for minister-mind-fe — and stretched a 102s build to 555s.
      # docker:24-dind, which this job used to run inside, bundles buildx; that
      # is the only reason builds were fast before the job container was dropped.
      # Nothing about it was ever declared, so restore it explicitly.
      #
      # driver: docker keeps BuildKit pointed at the daemon's built-in builder
      # and its local image store, so `docker buildx build -t` followed by
      # `docker push` still works. The default docker-container driver builds
      # into a separate cache and would need --load or --push instead.
      #
      # This installs the plugin under ~/.docker/cli-plugins, which the build
      # step below has to preserve when it repoints DOCKER_CONFIG for the
      # mounted ACR credential — see the comment there.
      - name: Enable BuildKit (the runner ships without buildx)
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and push
        id: build_step
        shell: bash
        env:
          ACR_LOGIN_SERVER: ${{ secrets.acr_login_server }}
          ACR_USERNAME: ${{ secrets.acr_username }}
          ACR_PASSWORD: ${{ secrets.acr_password }}
          IMAGE_NAME: ${{ inputs.image_name }}
          CONTEXT: ${{ inputs.context }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          BUILD_ARGS: ${{ inputs.build_args }}
          EXTRA_BUILD_ARG_SECRETS: ${{ secrets.extra_build_arg_secrets }}
          REF_NAME: ${{ github.ref_name }} #extract the tag 
          IS_TAG: ${{ github.ref_type == 'tag' }}
        run: |
          set -eu

          # Registry auth comes from one of two places, in this order:
          #
          #   1. /etc/acr/config.json — a docker config mounted into the runner
          #      pod from the cluster's `acr-push-config` secret. This is the
          #      normal path. GitHub organization secrets are a paid feature for
          #      private repos, so when tryloop-org moved to the Free plan the
          #      ACR_* secrets silently resolved to "" and every build failed on
          #      `docker login --username ""`. Reading the credential from the
          #      cluster removes GitHub from the loop entirely.
          #   2. The ACR_* secrets, for runners without that mount.
          #
          # MOUNTED_CONFIG is copied rather than used in place: the mount is
          # read-only and the docker CLI writes into its config directory.
          MOUNTED_CONFIG=/etc/acr/config.json
          USED_DOCKER_LOGIN=0

          if [ -f "$MOUNTED_CONFIG" ]; then
            echo ">>> auth: credential mounted from the cluster"
            export DOCKER_CONFIG="${RUNNER_TEMP}/docker-acr"
            mkdir -p "$DOCKER_CONFIG"

            # Seed from the runner's own ~/.docker before writing the
            # credential. The CLI resolves plugins from $DOCKER_CONFIG/cli-plugins,
            # so pointing DOCKER_CONFIG at a bare temp dir hides the buildx that
            # setup-buildx-action just installed under ~/.docker/cli-plugins —
            # `docker build` then silently falls back to the legacy builder and
            # the 5x slowdown that step exists to prevent comes straight back.
            if [ -d "${HOME}/.docker" ]; then
              cp -a "${HOME}/.docker/." "$DOCKER_CONFIG/"
            fi

            cp "$MOUNTED_CONFIG" "$DOCKER_CONFIG/config.json"
            chmod 600 "$DOCKER_CONFIG/config.json"

            # The registry host is the key under .auths, so the caller does not
            # have to supply acr_login_server alongside the mount.
            if [ -z "$ACR_LOGIN_SERVER" ]; then
              ACR_LOGIN_SERVER=$(grep -oE '[A-Za-z0-9_-]+\.azurecr\.io' "$MOUNTED_CONFIG" | head -1)
            fi
            if [ -z "$ACR_LOGIN_SERVER" ]; then
              echo "!!! ${MOUNTED_CONFIG} has no *.azurecr.io registry host and acr_login_server was not passed"
              exit 1
            fi
          else
            echo ">>> auth: ACR_* secrets"
            if [ -z "$ACR_LOGIN_SERVER" ] || [ -z "$ACR_USERNAME" ] || [ -z "$ACR_PASSWORD" ]; then
              echo "!!! no registry credential available:"
              echo "    ${MOUNTED_CONFIG} is not mounted, and the ACR_* secrets are empty."
              echo "    Empty secrets usually mean org-level secrets are not reaching this"
              echo "    private repo — check the organization's GitHub plan."
              exit 1
            fi
            echo "$ACR_PASSWORD" | docker login "$ACR_LOGIN_SERVER" \
              --username "$ACR_USERNAME" --password-stdin
            USED_DOCKER_LOGIN=1
          fi

          TARGET_IMAGE_TAG="${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${REF_NAME}"

          # Heredoc, not `echo | while`: a pipe runs the loop in a subshell and
          # every flag appended there is lost before docker build reads them.
          # EXTRA_BUILD_ARG_SECRETS rides along here — same KEY=VALUE lines,
          # just sourced from the caller's `secrets:` block.
          BUILD_ARG_FLAGS=""
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            BUILD_ARG_FLAGS="$BUILD_ARG_FLAGS --build-arg $line"
          done <<EOF
          $BUILD_ARGS
          $EXTRA_BUILD_ARG_SECRETS
          EOF

          # `docker buildx build`, not `docker build`: the latter degrades to the
          # legacy builder without failing when the plugin is not visible, which
          # is how a 102s build silently became 555s for weeks. Spelling out
          # buildx turns that into a hard error instead. Printing the version
          # first leaves the proof in the log.
          docker buildx version

          echo ">>> Building ${TARGET_IMAGE_TAG}"

          # On passe la chaîne de caractères directement (sans guillemets autour de la variable pour que le shell sépare les arguments)
          docker buildx build \
            $BUILD_ARG_FLAGS \
            -f "${DOCKERFILE}" \
            -t "${TARGET_IMAGE_TAG}" \
            "${CONTEXT}"

          echo ">>> Pushing single tag: ${TARGET_IMAGE_TAG}"

          # Pushes to ACR fail intermittently on self-hosted runners with
          # `connect: connection refused` mid-upload — SNAT port exhaustion
          # while several layers upload in parallel, or an ACR Traffic Manager
          # backend rotating out from under a cached IP. Neither is fixable
          # here and both clear on their own.
          #
          # Retrying is cheap and safe: a push is idempotent, so layers that
          # already landed are skipped and only the missing ones are re-sent.
          # The registry token is re-issued on each attempt, since a connection
          # dropped mid-auth can leave it unusable.
          PUSH_ATTEMPTS=3
          attempt=1
          until docker push "${TARGET_IMAGE_TAG}"; do
            if [ "$attempt" -ge "$PUSH_ATTEMPTS" ]; then
              echo "!!! push failed after ${PUSH_ATTEMPTS} attempts"
              exit 1
            fi
            backoff=$((attempt * 15))
            echo ">>> push attempt ${attempt}/${PUSH_ATTEMPTS} failed; retrying in ${backoff}s"
            sleep "$backoff"
            # Only re-issue the token on the login path; the mounted credential
            # is a static config the daemon re-reads on each push.
            if [ "$USED_DOCKER_LOGIN" = "1" ]; then
              echo "$ACR_PASSWORD" | docker login "$ACR_LOGIN_SERVER" \
                --username "$ACR_USERNAME" --password-stdin
            fi
            attempt=$((attempt + 1))
          done

          echo "image_ref=${TARGET_IMAGE_TAG}" >> "$GITHUB_OUTPUT"

          # Manifest digest of what we just pushed. RepoDigests is only
          # populated once the image has been pushed, which is why this runs
          # after the push loop and not next to the build.
          #
          # Callers on a MUTABLE tag (a branch name rather than v*.dev) have no
          # other way to identify this specific build: the tag string is the
          # same on every push, so verify-deploy.yml cannot tell the new
          # rollout from the previous one without this. Tag-driven callers can
          # ignore it.
          IMAGE_DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' \
            "${TARGET_IMAGE_TAG}" 2>/dev/null | cut -s -d'@' -f2 || true)"
          if [ -n "$IMAGE_DIGEST" ]; then
            echo ">>> Pushed digest: ${IMAGE_DIGEST}"
          else
            # Not fatal — the push already succeeded and tag-driven callers
            # never read this. Only a caller that asked to verify by digest
            # is affected, and verify-deploy.yml fails loudly on an empty one.
            echo ">>> WARNING: could not read a RepoDigest for ${TARGET_IMAGE_TAG}"
          fi
          echo "image_digest=${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"
          if [ "$USED_DOCKER_LOGIN" = "1" ]; then
            docker logout "$ACR_LOGIN_SERVER"
          else
            # The copy under RUNNER_TEMP holds the registry credential; the
            # runner is long-lived, so don't leave it on disk between jobs.
            rm -rf "$DOCKER_CONFIG"
          fi