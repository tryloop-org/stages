name: "Stage: Verify Tag Branch"

on:
  workflow_call:
    inputs:
      runner:
        description: >
          Runner labels as a JSON array. If the caller sets this, that value is used;
          if omitted, falls back to the in-cluster momah/ai-garden self-hosted runner below.
        type: string
        default: '["self-hosted", "linux", "x64", "momah", "ai-garden"]'
      required_branch:
        description: "Branch the pushed tag must be reachable from"
        type: string
        default: "production-v2"

jobs:
  verify:
    name: Verify tag descends from ${{ inputs.required_branch }}
    runs-on: ${{ fromJSON(inputs.runner) }}
    steps:
      - name: Checkout (full history — need branch ancestry)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Confirm ${{ github.ref_name }} is reachable from ${{ inputs.required_branch }}
        run: |
          git fetch origin "${{ inputs.required_branch }}"
          if ! git merge-base --is-ancestor "${{ github.sha }}" "origin/${{ inputs.required_branch }}"; then
            echo "::error::${{ github.ref_name }} (${{ github.sha }}) is not on branch ${{ inputs.required_branch }} -- refusing to deploy to prod. Cut prod tags from ${{ inputs.required_branch }} only."
            exit 1
          fi
          echo "OK: ${{ github.ref_name }} is reachable from ${{ inputs.required_branch }}"
